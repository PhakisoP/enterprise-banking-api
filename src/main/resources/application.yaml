spring:
  application:
    name: enterprise-banking-api

  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_banking
    username: root
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

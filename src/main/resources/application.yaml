spring:
  application:
    name: enterprise-banking-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_banking}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
